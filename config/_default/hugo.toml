theme = "blowfish"
baseURL = "https://rodrigolira.eti.br/"
defaultContentLanguage = "pt-BR"
pluralizeListTitles = true
enableRobotsTXT = true
summaryLength = 30
buildDrafts = false
buildFuture = false
enableEmoji = true
googleAnalytics = ""
titleCaseStyle = "none"

[pagination]
pagerSize = 20

[imaging]
anchor = "Center"

[taxonomies]
tag = "tag"
category = "category"
author = "authors"
series = "series"

[permalinks]
posts = "/:slug/"

[sitemap]
changefreq = "daily"
filename = "sitemap.xml"
priority = 0.5

[outputs]
home = [ "HTML", "RSS", "JSON" ]

[related]
threshold = 0
toLower = false

  [[related.indices]]
  name = "tags"
  weight = 100

  [[related.indices]]
  name = "categories"
  weight = 100

  [[related.indices]]
  name = "series"
  weight = 50

  [[related.indices]]
  name = "authors"
  weight = 20

  [[related.indices]]
  name = "date"
  weight = 10

  [[related.indices]]
  applyFilter = false
  name = "fragmentrefs"
  type = "fragments"
  weight = 10
